  <script src="/_sdk/afc2d393c2ac926b.editing_sdk.js" integrity="sha512-Ue7lZoRec1IGq7j3H/38aWZalTxanTjFGoCKdWTFUGFJwCO6Pinekpb6vP1nEQ3ZFuEOglmaFKfrRMeLheTxnw=="></script>
  <script>
    let currentLanguage = "es";
    let lastFocusedElement = null;

    const translations = {
      en: {

        "hero-title":"Engineering, construction and logistics for critical operations.",
        "hero-copy":"Specialized services for industrial, mining and petroleum sectors, with responsive delivery, operational safety and a sustainable vision.",
        "hero-cta":"EXPLORE OUR CAPABILITIES",

        "mission-title":"Mission","mission-copy":"To provide specialized engineering, maintenance, construction and IPCM management services with the highest safety and quality standards, ensuring our clients' operational continuity and contributing to national energy development.",
        "vision-title":"Vision","vision-copy":"To become the leading strategic partner in the industrial, mining and petroleum sectors, recognized for our responsiveness, technological innovation and commitment to environmental sustainability.",
        "divisions-kicker":"BUSINESS AREAS","divisions-title":"Specialized capability for every operational front.",
        "petroleum-title":"Petroleum Operations Support","petroleum-copy":"Construction of drill pads, heavy-load access roads and deployment of remote-camp infrastructure, including trailers.",

        "compliance-kicker":"SECTION 4 / LEGAL SUPPORT","compliance-heading":"Protected and Sustainable Operations.",
        "compliance-copy":"We implement due-diligence protocols aligned with OFAC standards, supporting legally protected operations before the Ministry of Petroleum and the CVM. ESG criteria transform extraction into a positive-impact model.",
        "sha-title":"HSE / Health, Safety & Environment","sha-copy":"We operate with a Zero Incidents culture, strict compliance with LOPCYMAT and robust industrial safety protocols, protecting people and strategic-information confidentiality.",

        "name-label":"Full name","company-label":"Company","email-label":"Email address","phone-label":"Phone number","subject-label":"Subject","message-label":"Message","submit-button":"SEND REQUEST",
        "success-message":"Thank you. Your request was sent successfully. Our team will contact you.","error-message":"We could not send your request at this time. Please try again.",
        "footer-menu-title":"NAVIGATION","footer-nav-home":"Home","footer-nav-about":"About us","footer-nav-divisions":"Divisions","footer-nav-compliance":"Compliance & ESG","footer-nav-contact":"Contact",

      }
    };

    const spanishDefaults = {
      "hero-cta":"EXPLORAR NUESTRAS CAPACIDADES",
      "submit-button":"ENVIAR SOLICITUD",
      "footer-name":"CONSTRUCCIONES Y DESARROLLOS FOLLIERI C.A.",
      "footer-rif":"RIF: J-50858104-9",
      "footer-menu-title":"NAVEGACIÓN",
      "footer-nav-home":"Inicio",
      "footer-nav-about":"Nosotros",
      "footer-nav-divisions":"Divisiones",
      "footer-nav-compliance":"Compliance y ESG",
      "footer-nav-contact":"Contacto",
      "footer-copy":"Ingeniería · Construcción · Logística pesada · Gestión IPCM",
      "footer-rights":"© 2026 CONSTRUCCIONES Y DESARROLLOS FOLLIERI C.A. Todos los derechos reservados."
    };
    document.querySelectorAll("[data-template-id]").forEach((element) => {
      const id = element.dataset.templateId;
      if (id && element.textContent.trim() && !spanishDefaults[id]) spanishDefaults[id] = element.textContent.trim();
    });

    function applyLanguage(language) {
      currentLanguage = language;
      document.documentElement.lang = language;
      const english = language === "en";
      Object.entries(translations.en).forEach(([id, englishText]) => {
        const element = document.querySelector(`[data-template-id="${id}"]`);
        if (!element) return;
        if (!spanishDefaults[id]) spanishDefaults[id] = element.textContent.trim();
        element.textContent = english ? englishText : spanishDefaults[id];
      });

      const button = document.getElementById("language-toggle");
      button.textContent = english ? "EN / ES" : "ES / EN";
      button.setAttribute("aria-pressed", String(english));
      button.setAttribute("aria-label", english ? "Switch to Spanish" : "Cambiar a inglés");

      document.querySelectorAll(".modal-close").forEach((closeButton) => {
        closeButton.setAttribute("aria-label", english ? "Close" : "Cerrar");
      });
    }

    document.getElementById("language-toggle").addEventListener("click", () => {
      applyLanguage(currentLanguage === "es" ? "en" : "es");
    });

    const form = document.getElementById("contact-form");
    const submitButton = document.getElementById("submit-button");
    const success = document.getElementById("form-success");
    const error = document.getElementById("form-error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      success.classList.add("hidden");
      error.classList.add("hidden");

      submitButton.disabled = true;
      submitButton.classList.add("opacity-60", "cursor-not-allowed");

      const result = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" }
      });

      submitButton.disabled = false;
      submitButton.classList.remove("opacity-60", "cursor-not-allowed");

      if (result.ok) {
        form.reset();
        success.classList.remove("hidden");
      } else {
        error.classList.remove("hidden");
      }
    });

    function openModal(modal) {
      lastFocusedElement = document.activeElement;
      modal.classList.add("open");
      modal.querySelector(".modal-close").focus();
    }

    function closeModal(modal) {
      modal.classList.remove("open");
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    document.querySelectorAll("[data-modal]").forEach((button) => {
      button.addEventListener("click", () => openModal(document.getElementById(button.dataset.modal)));
    });

    document.querySelectorAll(".modal-shell").forEach((modal) => {
      modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(modal); });
      modal.querySelector(".modal-close").addEventListener("click", () => closeModal(modal));
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") document.querySelectorAll(".modal-shell.open").forEach(closeModal);
    });

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
